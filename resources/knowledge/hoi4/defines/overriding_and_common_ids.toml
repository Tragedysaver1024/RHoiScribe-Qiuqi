relationships = [
    "Defines are engine-level constants: script never references them by id, but every system (production, command, XP, camera) reads them.",
    "replace_path in descriptor.mod replaces whole folders, so listing common/defines there hides the vanilla files from the loader.",
    "Load order is decided by file name first and then by mod load order; the last assignment of a key wins.",
    "A define applies to every country in the game, so per-country balance should use modifiers or ideas instead.",
    "Values must match the game build in use; the pack's 1.16 dumps and its older tutorials disagree, so the dump is the reference.",
    "Camera and UI keys are cosmetic but checksum-relevant for multiplayer, since the host and clients must share the same defines.",
]

validation = [
    "The file sits in common/defines/ with a .lua extension and its name sorts after the vanilla defines files.",
    "Every key is copied verbatim from the dump (module, spelling, capitalisation) - no invented names, no tutorial-era names.",
    "Value types match vanilla: int stays int, float keeps a decimal point, strings stay quoted, arrays keep vanilla arity and slot order.",
    "common/defines is absent from replace_path, and no other mod in the load order assigns the same keys.",
    "Diff the mod file against vanilla: only the intended keys are present, with no pasted blocks of unrelated defines.",
    "The change was confirmed in game (or by a changed checksum with no log error), and any temporary test line was removed.",
    "Balance impact was measured, not assumed: command cap, XP cap and factory-line caps change every country at once.",
]

