name: Release Builds

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v0.4.1-qiuqi.1). Leave empty to only build the binaries."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Collect executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/rhoiscribe.exe" "dist/rhoiscribe-windows-x86_64.exe"
          Copy-Item "resources/skill/SKILL.md" "dist/SKILL.md"
          Compress-Archive -Path "dist/rhoiscribe-windows-x86_64.exe", "dist/SKILL.md" -DestinationPath "dist/rhoiscribe-skill-windows-x86_64.zip" -Force
          Remove-Item "dist/SKILL.md"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/rhoiscribe-windows-x86_64.exe
            dist/rhoiscribe-skill-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Collect executable
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/rhoiscribe dist/rhoiscribe-linux-x86_64
          chmod +x dist/rhoiscribe-linux-x86_64
          cp resources/skill/SKILL.md dist/SKILL.md
          (cd dist && zip -9 rhoiscribe-skill-linux-x86_64.zip rhoiscribe-linux-x86_64 SKILL.md)
          rm dist/SKILL.md

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/rhoiscribe-linux-x86_64
            dist/rhoiscribe-skill-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS universal
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - name: Build x86_64 release binary
        run: cargo build --release --locked --target x86_64-apple-darwin

      - name: Build aarch64 release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Collect universal executable
        shell: bash
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/rhoiscribe \
            target/aarch64-apple-darwin/release/rhoiscribe \
            -output dist/rhoiscribe-macos-universal
          chmod +x dist/rhoiscribe-macos-universal
          cp resources/skill/SKILL.md dist/SKILL.md
          (cd dist && zip -9 rhoiscribe-skill-macos-universal.zip rhoiscribe-macos-universal SKILL.md)
          rm dist/SKILL.md

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/rhoiscribe-macos-universal
            dist/rhoiscribe-skill-macos-universal.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    permissions:
      contents: write

    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist

      - name: Download Linux asset
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist

      - name: Generate release notes
        shell: bash
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGE_RANGE="$PREVIOUS_TAG..${TAG_NAME}"
            CHANGE_HEADING="Changes since \`$PREVIOUS_TAG\`:"
          else
            CHANGE_RANGE="HEAD"
            CHANGE_HEADING="Included changes:"
          fi

          {
            echo "RHoiScribe-Qiuqi is a local MCP server and SKILL for Hearts of Iron IV modding agents."
            echo
            echo "This is a modified edition (fork) of [RHoiScribe](https://github.com/czxieddan/RHoiScribe) with knowledge drawn from the [秋起图书馆 / QIUQI LIBRARY](https://steamcommunity.com/sharedfiles/filedetails/?id=3445449478) modding library, distributed under AGPL-3.0-or-later. See [NOTICE](https://github.com/$GITHUB_REPOSITORY/blob/main/NOTICE) for the full attribution and the list of changes."
            echo
            echo "### Downloads"
            echo
            echo "Direct binaries:"
            echo
            echo "- Windows x86_64: \`rhoiscribe-windows-x86_64.exe\`"
            echo "- Linux x86_64: \`rhoiscribe-linux-x86_64\`"
            echo "- macOS universal: \`rhoiscribe-macos-universal\`"
            echo
            echo "Skill packages bundle \`SKILL.md\` with the matching executable:"
            echo
            echo "- Windows: \`rhoiscribe-skill-windows-x86_64.zip\`"
            echo "- Linux: \`rhoiscribe-skill-linux-x86_64.zip\`"
            echo "- macOS: \`rhoiscribe-skill-macos-universal.zip\`"
            echo
            echo "On Linux or macOS, run \`chmod +x <downloaded-file>\` if your system asks for executable permission."
            echo
            echo "Use the downloaded file path as the MCP server command. To print it, run the binary with \`--print-command\`. Without MCP setup, \`--skill list-tools\`, \`--skill list-resources\` and \`--skill list-prompts\` work from a Skill package."
            echo
            echo "### Changes"
            echo
            echo "$CHANGE_HEADING"
            git log --no-merges --pretty=format:'- %s (%h)' "$CHANGE_RANGE"
            echo
          } > release-notes.md

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RHoiScribe-Qiuqi $TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RHoiScribe-Qiuqi $TAG_NAME" \
              --notes-file release-notes.md
          fi

          gh release upload "$TAG_NAME" \
            dist/rhoiscribe-windows-x86_64.exe \
            dist/rhoiscribe-linux-x86_64 \
            dist/rhoiscribe-macos-universal \
            dist/rhoiscribe-skill-windows-x86_64.zip \
            dist/rhoiscribe-skill-linux-x86_64.zip \
            dist/rhoiscribe-skill-macos-universal.zip \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
